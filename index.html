<!DOCTYPE html><html lang="zh-TW"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Redirecting... | Barista Flow</title><script>(function(){const supportedLanguages = ["zh-TW","en","fr","ja","de","zh-CN","es","pt","ru","hi","bn","ar","ur"];
const defaultLang = "zh-TW";
const baseUrl = "/coffee-timer-app/";

    (function() {
      // Check localStorage first
      const savedLang = localStorage.getItem('barista-flow-lang');
      if (savedLang && supportedLanguages.includes(savedLang)) {
        window.location.replace(baseUrl + savedLang + '/');
        return;
      }
      
      // Auto-detect browser language
      const browserLang = navigator.language.split('-')[0];
      const exactLang = navigator.language; // e.g. "zh-TW"
      
      let targetLang = defaultLang;
      if (supportedLanguages.includes(exactLang)) {
        targetLang = exactLang;
      } else if (supportedLanguages.includes(browserLang)) {
        targetLang = browserLang;
      }
      
      // Save and redirect
      localStorage.setItem('barista-flow-lang', targetLang);
      window.location.replace(baseUrl + targetLang + '/');
    })();
  })();</script><!-- Fallback meta refresh for non-JS browsers --><noscript><meta http-equiv="refresh" content="0;url=/coffee-timer-app/zh-TW/"></noscript></head> <body class="bg-[#1C120C] flex items-center justify-center min-h-screen"> <div class="text-[#D9A05B] font-sans">
Loading your perfect brew...
</div> </body></html>
