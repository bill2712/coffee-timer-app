name: CI

# Checks only. The live site at coffeetimer.online is built and deployed by
# Cloudflare Workers Builds from the main branch (see wrangler.jsonc).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Type and template check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check internal links
        run: npm run check:links
