name: Bug report
description: Report a reproducible problem with the public site.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities or include personal data here. Use private vulnerability reporting for security concerns.
  - type: input
    id: url
    attributes:
      label: Affected page URL
      placeholder: https://coffeetimer.online/zh-TW/
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reliably shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 19 on iPhone, Chrome 141 on macOS, etc.
    validations:
      required: true
